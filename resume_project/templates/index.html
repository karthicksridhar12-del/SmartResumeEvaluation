<!DOCTYPE html>
<html>
<head>
    <title>Smart Resume Evaluation Tool</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #111827, #1e1b4b);
            color: #f8fafc;
            margin: 0;
            padding: 30px;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: 40px auto;
            background: rgba(30, 41, 59, 0.96);
            padding: 45px;
            border-radius: 20px;
            border: 1px solid #334155;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            font-size: 32px;
        }

        .subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 40px;
            font-size: 16px;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 10px;
            color: #e2e8f0;
        }

        input[type="file"] {
            width: 100%;
            padding: 14px;
            background: #0f172a;
            color: #cbd5e1;
            border: 1px solid #475569;
            border-radius: 10px;
            cursor: pointer;
        }

        textarea {
            width: 100%;
            padding: 15px;
            background: #0f172a;
            color: #f8fafc;
            border: 1px solid #475569;
            border-radius: 10px;
            font-family: Arial, sans-serif;
            font-size: 15px;
            resize: vertical;
            outline: none;
        }

        textarea:focus,
        input[type="file"]:focus {
            border-color: #60a5fa;
        }

        textarea::placeholder {
            color: #64748b;
        }

        .info {
            margin-top: -15px;
            margin-bottom: 25px;
            font-size: 13px;
            color: #94a3b8;
        }

        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            background: #1e3a8a;
            color: #ffffff;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        button:hover {
            transform: translateY(-3px);
        }

        button:active {
            transform: translateY(0);
        }

        @media (max-width: 600px) {
            body {
                padding: 15px;
            }

            .container {
                width: 100%;
                margin: 20px auto;
                padding: 25px;
            }

            h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>📄 Smart Resume Evaluation Tool</h1>

    <p class="subtitle">
        Upload your resume and compare it with a job description using AI-powered analysis
    </p>

    <form action="/evaluate" method="POST" enctype="multipart/form-data">

        <div class="form-group">
            <label>📎 Upload Your Resume</label>

            <input
                type="file"
                name="resume"
                accept=".pdf,.doc,.docx"
                required
            >

            <p class="info">
                Supported formats: PDF and DOCX
            </p>
        </div>


        <div class="form-group">
            <label>💼 Job Description</label>

            <textarea
                name="job_description"
                rows="12"
                placeholder="Paste the job description here..."
                required
            ></textarea>
        </div>


        <button type="submit">
            🤖 Evaluate Resume
        </button>

    </form>

</div>

</body>
</html>
